<!doctype html>
<html lang="en" data-theme-init><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INDORA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ══ INDORA ══════════════════════════════════════════════════════════════
   The market is cold. You are warm.
   Market prices render cyan; human judgement renders gold. Nothing else on
   this page may use either hue, so the only saturated colour on screen is
   always the thing you have to decide about.
   ═══════════════════════════════════════════════════════════════════════ */

:root{
  --bg:#F7F5F1; --bg-2:#EFEBE4; --panel:#FFFDFA; --panel-2:#FFFFFF;
  --line:#E6E0D6; --line-2:#D0C7B9;
  --ink:#141009; --ink-2:#5B5348; --ink-3:#8E8578;
  --cold:#00767F; --cold-2:#D0EBED; --cold-glow:rgba(0,118,127,.18);
  --warm:#A96200; --warm-2:#FCE9CD; --warm-glow:rgba(169,98,0,.22);
  --hot:#AF2318;
  --sh:0 1px 2px rgba(20,16,9,.05),0 10px 30px -14px rgba(20,16,9,.20);
  --sh-2:0 2px 6px rgba(20,16,9,.07),0 28px 56px -22px rgba(20,16,9,.32);
  --ring:0 0 0 1px var(--warm),0 0 0 5px var(--warm-glow);
}
:root:not([data-theme="light"]){ @media (prefers-color-scheme:dark){
  --bg:#08070D; --bg-2:#050409; --panel:#131120; --panel-2:#191627;
  --line:#241F3A; --line-2:#3A3358;
  --ink:#F4F1FB; --ink-2:#A49DBD; --ink-3:#6C6489;
  --cold:#33E1EC; --cold-2:#0B2E34; --cold-glow:rgba(51,225,236,.26);
  --warm:#FFBB57; --warm-2:#2E2011; --warm-glow:rgba(255,187,87,.28);
  --hot:#FF7C6C;
  --sh:0 1px 2px rgba(0,0,0,.55),0 14px 38px -16px rgba(0,0,0,.85);
  --sh-2:0 2px 8px rgba(0,0,0,.6),0 34px 68px -24px rgba(0,0,0,.95);
  --ring:0 0 0 1px var(--warm),0 0 0 5px var(--warm-glow);
}}
:root[data-theme="dark"]{
  --bg:#08070D; --bg-2:#050409; --panel:#131120; --panel-2:#191627;
  --line:#241F3A; --line-2:#3A3358;
  --ink:#F4F1FB; --ink-2:#A49DBD; --ink-3:#6C6489;
  --cold:#33E1EC; --cold-2:#0B2E34; --cold-glow:rgba(51,225,236,.26);
  --warm:#FFBB57; --warm-2:#2E2011; --warm-glow:rgba(255,187,87,.28);
  --hot:#FF7C6C;
  --sh:0 1px 2px rgba(0,0,0,.55),0 14px 38px -16px rgba(0,0,0,.85);
  --sh-2:0 2px 8px rgba(0,0,0,.6),0 34px 68px -24px rgba(0,0,0,.95);
  --ring:0 0 0 1px var(--warm),0 0 0 5px var(--warm-glow);
}

*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
html[data-theme-init] *{transition:none!important}   /* no flash of animation on load */

body{
  margin:0;min-height:100vh;color:var(--ink);background:var(--bg);
  font:400 15px/1.6 'Bricolage Grotesque',ui-sans-serif,-apple-system,system-ui,sans-serif;
  overflow-x:hidden;
}
/* slow drifting aurora — the only ambient motion on the page */
body::before{
  content:"";position:fixed;inset:-30%;z-index:0;pointer-events:none;
  background:
    radial-gradient(38% 44% at 18% 26%, var(--warm-glow), transparent 62%),
    radial-gradient(34% 40% at 82% 18%, var(--cold-glow), transparent 62%),
    radial-gradient(46% 46% at 62% 86%, var(--warm-glow), transparent 66%);
  filter:blur(30px);opacity:.85;
  animation:drift 34s ease-in-out infinite alternate;
}
@keyframes drift{
  0%{transform:translate3d(0,0,0) scale(1)}
  50%{transform:translate3d(2.5%,-2%,0) scale(1.07)}
  100%{transform:translate3d(-2%,2.5%,0) scale(1.02)}
}
.num{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
     font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ══ shell: sidebar + fluid main. No wasted gutters. ══ */
.shell{position:relative;z-index:1;display:grid;
       grid-template-columns:clamp(232px,18vw,290px) minmax(0,1fr);
       min-height:100vh;align-items:start}

/* ── sidebar ─────────────────────────────────────────────────────── */
.side{
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
  padding:1.6rem 1.35rem;gap:1.5rem;
  border-right:1px solid var(--line);
  background:color-mix(in srgb,var(--panel) 72%,transparent);
  backdrop-filter:blur(18px) saturate(1.3);
}
.brand{display:flex;align-items:center;gap:.7rem}
.brand-mark{
  width:34px;height:34px;border-radius:11px;flex:none;position:relative;overflow:hidden;
  background:linear-gradient(150deg,var(--warm),var(--hot) 62%,var(--cold));
  box-shadow:0 8px 22px -8px var(--warm-glow),inset 0 1px 0 rgba(255,255,255,.4);
  animation:spinhue 18s linear infinite;
}
@keyframes spinhue{to{filter:hue-rotate(360deg)}}
.brand-name{font-size:1.02rem;font-weight:800;letter-spacing:.16em;margin:0;line-height:1}
.brand-sub{font-size:.62rem;color:var(--ink-3);letter-spacing:.1em;
           text-transform:uppercase;margin:.28rem 0 0}

.stats{display:grid;gap:.5rem}
.stat{
  padding:.7rem .8rem;border:1px solid var(--line);border-radius:13px;
  background:color-mix(in srgb,var(--panel-2) 55%,transparent);
  transition:border-color .2s,transform .2s;
}
.stat:hover{border-color:var(--line-2);transform:translateX(2px)}
.stat-k{font-size:.58rem;text-transform:uppercase;letter-spacing:.11em;color:var(--ink-3)}
.stat-v{font-size:1.5rem;font-weight:800;line-height:1.1;letter-spacing:-.04em;margin-top:.1rem}
.stat--live .stat-v{color:var(--warm)}

.gate{
  font-size:.7rem;line-height:1.55;color:var(--ink-2);
  padding:.75rem .8rem;border-radius:13px;
  border:1px dashed var(--line-2);
  background:color-mix(in srgb,var(--panel) 40%,transparent);
}
.gate .dot{display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--warm);box-shadow:0 0 0 3px var(--warm-glow);margin-right:.4rem;
  animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.28}}

.keys{margin-top:auto;display:grid;gap:.3rem;font-size:.66rem;color:var(--ink-3)}
.keys div{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
kbd{
  font:600 .62rem/1 'JetBrains Mono',monospace;padding:.22rem .4rem;border-radius:5px;
  border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink-2);
}
#theme{
  width:100%;margin-top:.6rem;padding:.55rem;border-radius:11px;cursor:pointer;
  border:1px solid var(--line);background:var(--panel-2);color:var(--ink-2);
  font:inherit;font-size:.72rem;display:flex;align-items:center;justify-content:center;gap:.4rem;
  transition:color .18s,border-color .18s,transform .18s;
}
#theme:hover{color:var(--warm);border-color:var(--warm);transform:translateY(-1px)}

/* ── main ────────────────────────────────────────────────────────── */
.main{padding:2.1rem clamp(1.1rem,3.2vw,3rem) 5rem;min-width:0}
.main-head{display:flex;align-items:flex-end;gap:1rem;margin-bottom:1.6rem;flex-wrap:wrap}
.main-head h2{font-size:1.62rem;font-weight:800;letter-spacing:-.04em;margin:0;line-height:1}
.main-head p{margin:0;color:var(--ink-3);font-size:.8rem}

:focus-visible{outline:2px solid var(--warm);outline-offset:3px;border-radius:8px}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;
        border-right:0;border-bottom:1px solid var(--line);gap:1rem;padding:1rem 1.1rem}
  .stats{grid-auto-flow:column;gap:.5rem;flex:1}
  .stat{padding:.5rem .6rem}.stat-v{font-size:1.1rem}
  .gate{flex-basis:100%;order:9}
  .keys{display:none}
  #theme{width:auto;margin:0;padding:.5rem .7rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<div class="shell">

  <aside class="side">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <div>
        <p class="brand-name">INDORA</p>
        <p class="brand-sub">judgment ledger</p>
      </div>
    </div>

    <div class="stats">
      <div class="stat stat--live">
        <div class="stat-k">In the queue</div>
        <div class="stat-v num" data-count="{{ rows|length }}">0</div>
      </div>
      <div class="stat">
        <div class="stat-k">Scored</div>
        <div class="stat-v num" data-count="0">0</div>
      </div>
    </div>

    <p class="gate"><span class="dot"></span>{{ gate }}</p>

    <div class="keys">
      <div><span>next / prev</span><span><kbd>J</kbd> <kbd>K</kbd></span></div>
      <div><span>take yes</span><kbd>A</kbd></div>
      <div><span>pass</span><kbd>P</kbd></div>
      <div><span>theme</span><kbd>T</kbd></div>
      <button id="theme" type="button">◐ switch theme</button>
    </div>
  </aside>

  <main class="main">
    <div class="main-head">
      <h2>Today's calls</h2>
      <p>your probability against the market's price</p>
    </div>
    {% block content %}{% endblock %}
  </main>

</div>

<script>
(function(){
  var root=document.documentElement;
  try{ var t=localStorage.getItem('theme'); if(t)root.dataset.theme=t; }catch(e){}
  requestAnimationFrame(function(){ root.removeAttribute('data-theme-init'); });

  function flip(){
    var cur=root.dataset.theme;
    if(!cur) cur = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light';
    var next = cur==='dark' ? 'light':'dark';
    root.dataset.theme=next;
    try{ localStorage.setItem('theme',next); }catch(e){}
  }
  document.getElementById('theme').addEventListener('click',flip);

  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* count-up on the sidebar stats */
  document.querySelectorAll('[data-count]').forEach(function(el){
    var target=+el.dataset.count||0;
    if(reduce||!target){ el.textContent=target; return; }
    var t0=null, dur=620;
    function step(ts){
      if(!t0)t0=ts;
      var p=Math.min((ts-t0)/dur,1), e=1-Math.pow(1-p,3);
      el.textContent=Math.round(target*e);
      if(p<1)requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });

  /* keyboard: J/K move, A accept, P pass, T theme */
  var cards=[].slice.call(document.querySelectorAll('.card'));
  var idx=-1;
  function focusCard(i){
    if(!cards.length)return;
    idx=Math.max(0,Math.min(i,cards.length-1));
    cards.forEach(function(c,n){ c.classList.toggle('is-focus', n===idx); });
    cards[idx].scrollIntoView({behavior:reduce?'auto':'smooth',block:'center'});
  }
  document.addEventListener('keydown',function(e){
    if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName))return;
    var k=e.key.toLowerCase();
    if(k==='j'){e.preventDefault();focusCard(idx+1);}
    else if(k==='k'){e.preventDefault();focusCard(idx-1);}
    else if(k==='t'){e.preventDefault();flip();}
    else if(k==='a'&&idx>=0){var b=cards[idx].querySelector('.btn--go:not([disabled])');if(b)b.click();}
    else if(k==='p'&&idx>=0){var r=cards[idx].querySelector('.btn--pass');if(r)r.click();}
  });
  if(cards.length)focusCard(0);

  /* rails draw themselves in, staggered */
  if(!reduce){
    cards.forEach(function(c,n){
      setTimeout(function(){ c.classList.add('is-drawn'); }, 90*n + 120);
    });
  } else { cards.forEach(function(c){ c.classList.add('is-drawn'); }); }

  /* a decision should feel like one: animate the card out, then submit */
  document.querySelectorAll('.card form').forEach(function(f){
    f.addEventListener('submit',function(ev){
      if(reduce)return;
      var card=f.closest('.card');
      if(!card||card.dataset.leaving)return;
      ev.preventDefault();
      card.dataset.leaving='1';
      card.classList.add(f.action.indexOf('/accept')>-1?'leave-yes':'leave-pass');
      setTimeout(function(){ f.submit(); },340);
    });
  });
})();
</script>
</body></html>
