<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Judgment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ── The idea ────────────────────────────────────────────────────────────
   The market is cold. You are warm.
   Every market price renders cyan; every human judgement renders gold.
   The rail makes the distance between them visible, and that distance is
   the only reason to act. Nothing else on the page may use either hue.
   ──────────────────────────────────────────────────────────────────── */

:root{
  /* light — warm paper, not clinical white */
  --bg:#F6F4F0; --bg-2:#EDE9E3;
  --card:#FFFDFA; --card-2:#FFFFFF;
  --line:#E4DED5; --line-2:#CFC7BB;
  --ink:#14100C; --ink-2:#5C544A; --ink-3:#8C8377;
  --cold:#0E7C86; --cold-soft:#D3ECEE; --cold-glow:rgba(14,124,134,.16);
  --warm:#B26A00; --warm-soft:#FBE8CC; --warm-glow:rgba(178,106,0,.20);
  --hot:#B3261E;
  --shadow:0 1px 2px rgba(20,16,12,.05), 0 8px 24px -12px rgba(20,16,12,.18);
  --shadow-lift:0 2px 4px rgba(20,16,12,.06), 0 20px 40px -18px rgba(20,16,12,.28);
}
:root:not([data-theme="light"]){ @media (prefers-color-scheme:dark){
  --bg:#0C0B11; --bg-2:#08070C;
  --card:#16141E; --card-2:#1C1926;
  --line:#282437; --line-2:#3A3550;
  --ink:#F2EFF7; --ink-2:#A29CB4; --ink-3:#6E6883;
  --cold:#3DD9E4; --cold-soft:#0E2B31; --cold-glow:rgba(61,217,228,.22);
  --warm:#FFB44D; --warm-soft:#2E2113; --warm-glow:rgba(255,180,77,.24);
  --hot:#FF7A6B;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 32px -14px rgba(0,0,0,.8);
  --shadow-lift:0 2px 6px rgba(0,0,0,.55), 0 28px 56px -20px rgba(0,0,0,.9);
}}
:root[data-theme="dark"]{
  --bg:#0C0B11; --bg-2:#08070C;
  --card:#16141E; --card-2:#1C1926;
  --line:#282437; --line-2:#3A3550;
  --ink:#F2EFF7; --ink-2:#A29CB4; --ink-3:#6E6883;
  --cold:#3DD9E4; --cold-soft:#0E2B31; --cold-glow:rgba(61,217,228,.22);
  --warm:#FFB44D; --warm-soft:#2E2113; --warm-glow:rgba(255,180,77,.24);
  --hot:#FF7A6B;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 32px -14px rgba(0,0,0,.8);
  --shadow-lift:0 2px 6px rgba(0,0,0,.55), 0 28px 56px -20px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{
  margin:0; padding:0 1.25rem 6rem; min-height:100vh;
  background:
    radial-gradient(1100px 520px at 12% -8%, var(--warm-glow), transparent 62%),
    radial-gradient(900px 460px at 92% 4%, var(--cold-glow), transparent 60%),
    linear-gradient(var(--bg), var(--bg-2));
  background-attachment:fixed;
  color:var(--ink);
  font:400 15px/1.6 'Bricolage Grotesque',ui-sans-serif,-apple-system,system-ui,sans-serif;
}
.wrap{max-width:820px;margin:0 auto}
.num{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
     font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ── masthead ─────────────────────────────────────────────────────── */
header{display:flex;align-items:center;gap:.85rem;padding:2.75rem 0 1.1rem}
.mark{
  width:34px;height:34px;border-radius:11px;flex:none;position:relative;
  background:linear-gradient(145deg,var(--warm),var(--hot));
  box-shadow:0 6px 18px -6px var(--warm-glow), inset 0 1px 0 rgba(255,255,255,.35);
}
.mark::after{
  content:"";position:absolute;inset:0;border-radius:11px;
  background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.55), transparent 55%);
}
h1{font-size:1.5rem;font-weight:800;letter-spacing:-.035em;margin:0;line-height:1}
.sub{color:var(--ink-3);font-size:.78rem;margin:.22rem 0 0;letter-spacing:.01em}
#theme{
  margin-left:auto;width:38px;height:38px;border-radius:12px;cursor:pointer;
  border:1px solid var(--line);background:var(--card);color:var(--ink-2);
  font-size:15px;line-height:1;display:grid;place-items:center;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1),border-color .18s,color .18s;
}
#theme:hover{transform:translateY(-2px) rotate(-12deg);color:var(--warm);border-color:var(--warm)}

/* ── the gate: the one line that must never be dressed up ─────────── */
.gate{
  display:flex;gap:.7rem;align-items:flex-start;
  margin:0 0 2.25rem;padding:.85rem 1rem;
  border:1px dashed var(--line-2);border-radius:14px;
  background:color-mix(in srgb, var(--card) 60%, transparent);
  color:var(--ink-2);font-size:.8rem;line-height:1.5;
}
.gate .dot{
  width:7px;height:7px;border-radius:50%;background:var(--warm);flex:none;margin-top:.42rem;
  box-shadow:0 0 0 4px var(--warm-glow);
  animation:pulse 2.6s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.32}}

:focus-visible{outline:2px solid var(--warm);outline-offset:3px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><div class="wrap">
<header>
  <div class="mark" aria-hidden="true"></div>
  <div>
    <h1>Judgment</h1>
    <p class="sub">your call against the market's</p>
  </div>
  <button id="theme" type="button" aria-label="Switch theme">&#9680;</button>
</header>

<p class="gate"><span class="dot"></span><span>{{ gate }}</span></p>

{% block content %}{% endblock %}
</div>
<script>
(function(){
  var b=document.getElementById('theme');
  try{ var t=localStorage.getItem('theme'); if(t)document.documentElement.dataset.theme=t; }catch(e){}
  b.addEventListener('click',function(){
    var cur=document.documentElement.dataset.theme;
    if(!cur){ cur = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light'; }
    var next = cur==='dark' ? 'light':'dark';
    document.documentElement.dataset.theme=next;
    try{ localStorage.setItem('theme',next); }catch(e){}
  });
})();
</script>
</body></html>
